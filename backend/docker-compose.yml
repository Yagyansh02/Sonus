# ═══════════════════════════════════════════════════════════════
# Docker Compose — Neo4j for Sonus
# ═══════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d
#   docker compose down
# ═══════════════════════════════════════════════════════════════

services:
  neo4j:
    image: neo4j:5-community
    container_name: sonus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol
    environment:
      # Authentication
      NEO4J_AUTH: neo4j/sonus_password
      # Create the 'sonus' database on first run
      NEO4J_PLUGINS: '[]'
      # Memory configuration (adjust for your machine)
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Allow database creation
      NEO4J_dbms_default__database: sonus
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
